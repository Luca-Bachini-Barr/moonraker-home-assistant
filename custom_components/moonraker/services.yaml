send_gcode:
  name: "Send G-code"
  description: "Send a custom G-code command to the printer"
  fields:
    device_id:
      name: "Printer"
      description: "Moonraker device that should receive the G-code"
      required: true
      selector:
        device:
          integration: moonraker
    gcode:
      name: "G-code"
      description: "G-code command to send to the printer"
      required: true
      example: "G28"
      selector:
        text:
    wait:
      name: "Wait for completion"
      description: "Wait until the printer has finished the G-code. Turn off for long commands such as filament loads, which take longer than the 120 second request timeout; the call then returns after a few seconds, still reporting errors the printer raises straight away."
      required: false
      default: true
      selector:
        boolean:
